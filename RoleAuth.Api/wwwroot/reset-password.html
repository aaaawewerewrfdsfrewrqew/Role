<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скидання пароля</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; display: flex; justify-content: center; padding: 48px 16px; }
    .card { background: #fff; padding: 32px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin-top: 0; }
    label { display: block; font-size: 14px; margin: 14px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 16px; font-size: 14px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Новий пароль</h1>
    <form id="form">
      <label for="p1">Новий пароль (мінімум 8 символів)</label>
      <input id="p1" type="password" minlength="8" required autocomplete="new-password">
      <label for="p2">Повторіть пароль</label>
      <input id="p2" type="password" minlength="8" required autocomplete="new-password">
      <button id="btn" type="submit">Змінити пароль</button>
    </form>
    <div id="msg"></div>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get('token');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    function show(text, ok) { msg.textContent = text; msg.className = ok ? 'ok' : 'err'; }

    if (!token) { show('Недійсне посилання: відсутній токен.', false); btn.disabled = true; }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('p1').value;
      if (p1 !== document.getElementById('p2').value) { show('Паролі не збігаються.', false); return; }

      btn.disabled = true;
      try {
        const r = await fetch('/api/account/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: p1 })
        });
        const data = await r.json().catch(() => ({}));
        if (r.ok) { show(data.message || 'Готово', true); document.getElementById('form').style.display = 'none'; return; }
        const validation = data.errors ? Object.values(data.errors).flat()[0] : null;
        show(validation || data.detail || 'Сталася помилка', false);
      } catch { show('Не вдалося зв\u2019язатися із сервером.', false); }
      btn.disabled = false;
    });
  </script>
</body>
</html>
